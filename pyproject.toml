[tool.poetry]
name = "tgdl"
version = "1.2.4"
description = "A high-performance CLI tool for downloading media from Telegram"
authors = ["kavidu-dilhara <contact@kavidudilhara.eu.org>"]
homepage = "https://github.com/kavidu-dilhara/tgdl"
repository = "https://github.com/kavidu-dilhara/tgdl"
documentation = "https://github.com/kavidu-dilhara/tgdl#readme"
keywords = ["telegram", "downloader", "media", "cli", "async"]
license = "MIT"
readme = "README.md"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
telethon = ">=1.42.0"
click = ">=8.3.1"
tqdm = ">=4.67.1"
cryptography = ">=46.0.3"

[tool.poetry.group.dev.dependencies]
black = ">=25.11.0,<26"
flake8 = ">=7.3.0,<8"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/kavidu-dilhara/tgdl/issues"

[tool.poetry.scripts]
tgdl = "tgdl.cli:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
